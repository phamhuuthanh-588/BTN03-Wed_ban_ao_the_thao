<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dịch Vụ Thiết Kế Áo</title>
    <link rel="stylesheet" href="dichvu.css"> 
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>DỊCH VỤ</h2>
            <p>(Thiết kế áo theo yêu cầu)</p>
        </div>

        <form id="orderForm">
            <div class="form-group">
                <label>Chọn màu sắc (7 màu cơ bản):</label>
                <div class="color-options">
                    <div class="color-item active" style="background-color: #ff0000;" data-color="Đỏ"></div>
                    <div class="color-item" style="background-color: #ff8c00;" data-color="Cam"></div>
                    <div class="color-item" style="background-color: #ffff00;" data-color="Vàng"></div>
                    <div class="color-item" style="background-color: #008000;" data-color="Lục"></div>
                    <div class="color-item" style="background-color: #0000ff;" data-color="Lam"></div>
                    <div class="color-item" style="background-color: #4b0082;" data-color="Chàm"></div>
                    <div class="color-item" style="background-color: #ee82ee;" data-color="Tím"></div>
                </div>
                <input type="hidden" id="selectedColor" name="color" value="Đỏ">
            </div>

            <div class="form-group">
                <label for="fabric">Loại vải:</label>
                <select id="fabric" name="fabric">
                    <option value="me-thai">Mè Thái</option>
                    <option value="ban-player">Bản Player</option>
                    <option value="ca-sau-poly">Cá Sấu Poly</option>
                    <option value="thun-lanh">Thun lạnh</option>
                </select>
            </div>

            <div class="form-group">
                <label for="size">Kích thước (Size):</label>
                <select id="size" name="size">
                    <option value="S">Size S</option>
                    <option value="M">Size M</option>
                    <option value="L">Size L</option>
                    <option value="XL">Size XL</option>
                    <option value="2XL">Size 2XL</option>
                    <option value="3XL">Size 3XL</option>
                </select>
            </div>

            <div class="form-group">
                <label for="file">Upload file ảnh mẫu:</label>
                <label class="upload-box" for="file">
                    <span id="upload-text">Nhấp vào đây để chọn ảnh mẫu</span>
                    <input type="file" id="file" accept="image/*" style="display:none;">
                </label>
                
                <div id="preview-container" style="display: none; position: relative; width: fit-content; margin: 20px auto;">
                    <img id="preview-img" src="#" alt="Xem trước" style="max-width: 250px; border-radius: 8px; border: 2px solid #00ffd4; display: block;">
                    <span id="remove-btn" style="position: absolute; top: -12px; right: -12px; background: #ff4d4d; color: white; width: 26px; height: 26px; border-radius: 50%; text-align: center; line-height: 24px; cursor: pointer; font-weight: bold; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.3); z-index: 10;">×</span>
                </div>
            </div>

            <button type="submit" class="btn-submit">Gửi yêu cầu thiết kế</button>
        </form>
    </div>

    <script src="dichvu.js"></script>
</body>
</html>
