

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Gr3</title>
    <link rel="icon" href="../Img/Trang chủ/favicon1.png" type="image/png">
    <link rel="stylesheet" href="../fontawesome-free-7.1.0-web/css/all.min.css">
    <link rel="stylesheet" href="../Trang_chủ.css"> 
    <link rel="stylesheet" href="dangnhap.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300&display=swap" rel="stylesheet">
   

    
</head>
<body>
    <header id="thanhtacvu"> 
        <nav class="thanh_header">
            <div id="logo_header-search">
                <div class="logo_header">
                    <a href="../../index.html">
                        <img id="img1" src="../Img/Header/logoheader.png" alt="logo_header">
                    </a>
                </div>
                <div class="search">
                    <i class="fa-solid fa-magnifying-glass" style="color: #ffffff;"></i>
                    <input id="input_search" type="search" placeholder="Tìm kiếm sản phẩm">
                </div>
            </div>     

            <div id="nav">
                <div id="nav-button_dang_nhap">
                    <a href="#">
                        <i class="fa-regular fa-user" style="color: #000000; font-size: 18px;"></i>
                        <span>Đăng nhập</span>
                    </a>
                </div>
                <div id="gioi-thieu"><a href="/Trang chủ/Giới thiệu/gioithieu.html">Giới thiệu</a></div>
                <div id="dich_vu"><a href="../Dịch vụ/dichvu.html">Dịch vụ</a></div>
                <div id="san_pham"><a href="/Trang chủ/Sản phẩm/Sản_phẩm.html">Sản phẩm</a></div>
                <div id="lien_he"><a href="/Trang chủ/Liên hệ/lienhe.html">Liên hệ</a></div> 
            </div>

            <div id="dang_nhap-cart">
                <div id="cart">
                    <a href="../Giỏ hàng/giohang.html">
                        <i class="fa-solid fa-cart-shopping" style="color: #000000; font-size: 18px;"></i>
                        <span> Giỏ hàng</span>
                    </a>
                </div>
            </div> 
        </nav>
    </header>
    <main class="login-container">
    <div class="login-left">
        <img src="../Img/Trang chủ/Logo.png" alt="Logo GR3" class="logo-image">
    </div>

    <div class="login-box">
        <form id="theone" action="#">
            <div class="input-box">
                <input id="loginname" type="text" placeholder="Tên người dùng" required>
                <small class="message"></small> 
            </div>
            
            <div class="input-box">
                <input type="password" id="password-input" placeholder="Mật khẩu" required>
                <i class="fa-solid fa-eye" id="toggle-password"></i>
                <small class="message"></small> 
            </div>
            
            <button type="submit" id="btn-dang-nhap" class="btn">Đăng nhập</button>

            <div class="social-login">
                <button type="button" class="btn-google" onclick="window.location.href='https://accounts.google.com/Login?btmpl=mobile_tier2&hl=vi&service=mail'"> Đăng nhập bằng Google
                    <i class="fa-brands fa-google" style="font-size: 18px; color: #ea5935;"></i> 
                           
                        
                </button>
                <button type="button" class="btn-facebook"onclick="window.location.href='https://www.facebook.com/?locale=vi_VN'"> Đăng nhập bằng Facebook
                    <i class="fa-brands fa-facebook-f" style="font-size: 13px;" ></i>
                       
                </button>
            </div>
            <div class="login-links">
                <a href="../Quên mật khẩu/quenmatkhau.html">Quên mật khẩu</a>
                <a href="../Đăng ký/dangky.html">Tạo tài khoản mới &rarr;</a>
            </div>
        </form> 
    </div>
</main>
     
    <script src="../Trang_chủ.js"></script>
    <script src="dangnhap.js"></script>
</body>
</html>
